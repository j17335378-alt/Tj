name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app (static)
        run: |
          npx vite build --config apk-web/vite.config.mjs
          ls -la www

      - name: Create Android project
        run: |
          mkdir -p "$RUNNER_TEMP/wrap"
          cp -r www "$RUNNER_TEMP/wrap/www"
          cd "$RUNNER_TEMP/wrap"
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.tikjil.app",
            "appName": "TikJil",
            "webDir": "www"
          }
          JSON
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd "$RUNNER_TEMP/wrap/android"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: TikJil-apk
          path: ${{ runner.temp }}/wrap/android/app/build/outputs/apk/debug/app-debug.apk
