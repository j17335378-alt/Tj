name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "رابط الموقع على Vercel (https://...)"
        required: false
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ github.event.inputs.app_url || vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check app URL
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::لازم رابط الموقع. شغّل الـ workflow يدوياً واكتب الرابط، أو أضف Variable اسمه APP_URL من Settings > Secrets and variables > Actions > Variables"
            exit 1
          fi
          echo "Using $APP_URL"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Android wrapper
        run: |
          mkdir -p "$RUNNER_TEMP/wrap/www"
          cd "$RUNNER_TEMP/wrap"
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat > www/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><title>TikJil</title>
          EOF
          cat > capacitor.config.json <<EOF
          {
            "appId": "com.tikjil.app",
            "appName": "TikJil",
            "webDir": "www",
            "server": { "url": "$APP_URL", "cleartext": false }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd "$RUNNER_TEMP/wrap/android"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: TikJil-apk
          path: ${{ runner.temp }}/wrap/android/app/build/outputs/apk/debug/app-debug.apk
